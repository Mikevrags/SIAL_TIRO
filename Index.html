<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIAL TIRO</title>
<style>body{background:#0f172a;color:white;font-family:sans-serif;text-align:center;padding:20px}button{font-size:28px;padding:15px 30px;border-radius:15px;border:none;background:#f97316;color:white}h1{font-size:40px}#canasta{font-size:100px}</style>
</head>
<body>
<h1>🏀 SIAL TIRO</h1>
<div id="canasta">🏀</div>
<h2 id="marcador">Encestes: 0 / Tiros: 0</h2>
<button onclick="tirar()">¡TIRAR!</button>
<p id="msg">Toca TIRAR para practicar</p>
<script>
let enc=0, tiros=0;
function tirar(){tiros++; let entra=Math.random()>0.4; if(entra){enc++; document.getElementById('msg').innerText='¡ENCANASTASTE! 🎉';} else {document.getElementById('msg').innerText='Fallaste, ¡otra vez!';} document.getElementById('marcador').innerText='Encestes: '+enc+' / Tiros: '+tiros;}
</script>
</body></html>
