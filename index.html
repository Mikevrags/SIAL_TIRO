<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIAL TIRO - 1ra Persona</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{background:#0a1628;color:white;padding:10px;padding-bottom:30px}
/* ===== BARRA SUPERIOR - AL DOBLE Y MÁS LARGA ===== */
.top{text-align:center;background:#13233f;border-radius:0 0 18px 18px;padding:22px 10px 34px 10px;margin:-10px -10px 14px -10px;border-bottom:3px solid #ff6b00}
.top h1{font-size:56px;line-height:1.05;letter-spacing:1px}
.sub{color:#ffb703;font-size:26px;line-height:1.2;margin:10px 0 0 0;font-weight:800}
.card{background:#13233f;border:1px solid #2a3f66;border-radius:16px;padding:12px;margin-bottom:10px}
select{width:100%;padding:14px;border-radius:10px;border:0;background:white;color:#111;font-size:17px;font-weight:700}
/* ===== FRANJA DE PUNTOS - MÁS GRANDE ===== */
.marcador{display:flex;justify-content:space-between;text-align:center;margin-top:14px;gap:8px}
.marcador div{flex:1;background:#0a1628;border-radius:14px;padding:20px 4px;border:1px solid #2a3f66}
.marcador b{font-size:48px;display:block;line-height:1}
.marcador span{font-size:22px;color:#a8bcdd;font-weight:800;display:block;margin-top:6px;letter-spacing:.5px}
#cancha{width:100%;height:480px;background:#111;display:block;border-radius:14px;border:3px solid white}
label{font-size:14px;font-weight:700;display:flex;justify-content:space-between;margin:12px 0 4px}
input[type=range]{width:100%;height:28px;accent-color:#ff6b00}
.btn{width:100%;padding:16px;border:0;border-radius:14px;font-size:22px;font-weight:900;cursor:pointer}
.btn-tirar{background:#ff6b00;color:white;margin-top:12px}
.btn-reset{background:#2a3f66;color:white;margin-top:8px;font-size:15px;padding:12px}
#msg{text-align:center;font-weight:900;font-size:19px;min-height:28px;margin-top:10px}
#detalle{text-align:center;color:#d6e2ff;font-size:13px;min-height:20px}
</style>
</head>
<body>
<div class="top"><h1>🏀 SIAL TIRO</h1><div class="sub">VISTA 1RA PERSONA • DESDE TUS HOMBROS • JORNADA 7 LIGA NIKE</div></div>

<div class="card">
<select id="juego">
<option>20 Nov 17:00 • 7B • REDBULLS DIEGO vs TEPEYAC</option>
<option>20 Nov 18:00 • 7E • REDBULLS JERRY vs LYCANS TOÑO</option>
<option selected>21 Nov 10:00 • 12G • KADEMY MIKE vs BOSQUES FALCONS</option>
<option>21 Nov 11:00 • 1C • KADEMY MIKE vs BEARS CHARLY</option>
<option>21 Nov 10:00 • 5G • ENCINO KEVIN vs MARISTA PACHECO</option>
<option>21 Nov 11:00 • 17F • ENTORNO MIKE vs MARISTA INV</option>
<option>21 Nov 12:00 • 9E • MARISTA PACHECO vs ENCINO PACO</option>
</select>
<div class="marcador">
<div><b id="enc">0</b><span>ENCESTES</span></div>
<div><b id="tir">0</b><span>TIROS</span></div>
<div><b id="por">0%</b><span>EFECTIVIDAD</span></div>
</div>
</div>

<div class="card" style="padding:8px">
<canvas id="cancha" width="360" height="480"></canvas>
<div id="msg">¡Tú tienes el balón! 🏀</div>
<div id="detalle">Mira el aro, ajusta ángulo y tira.</div>
</div>

<div class="card">
<label><span>📐 ÁNGULO DE TIRO</span><span id="angTxt">52°</span></label>
<input type="range" id="angulo" min="30" max="80" value="52">
<label><span>💪 FUERZA</span><span id="fueTxt">72%</span></label>
<input type="range" id="fuerza" min="30" max="100" value="72">
<button class="btn btn-tirar" onclick="tirar()">¡TIRAR! 🏀</button>
<button class="btn btn-reset" onclick="reiniciar()">↺ Reiniciar marcador</button>
</div>

<script>
const cv=document.getElementById('cancha'), ctx=cv.getContext('2d');
let enc=0, tir=0, anim=null;
let balon={x:180,y:390,escala:1,visible:true};
let vuelo=null;

function dibujar(){
 ctx.clearRect(0,0,360,480);
 ctx.fillStyle='#0a1628'; ctx.fillRect(0,0,360,180);
 ctx.fillStyle='#1a2f55'; ctx.fillRect(0,140,360,60);
 ctx.fillStyle='#ffb703'; ctx.font='bold 13px Arial'; ctx.fillText('SIAL • LIGA NIKE • JORNADA 7', 78, 165);
 ctx.fillStyle='#d97a26'; ctx.beginPath(); ctx.moveTo(0,480); ctx.lineTo(110,190); ctx.lineTo(250,190); ctx.lineTo(360,480); ctx.closePath(); ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2.5;
 ctx.beginPath(); ctx.moveTo(0,480); ctx.lineTo(110,190); ctx.moveTo(360,480); ctx.lineTo(250,190); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(95,330); ctx.lineTo(265,330); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(135,260); ctx.lineTo(225,260); ctx.stroke();
 ctx.fillStyle='white'; ctx.fillRect(115,55,130,95);
 ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.strokeRect(115,55,130,95);
 ctx.fillStyle='#ff6b00'; ctx.fillRect(162,108,36,28);
 ctx.fillStyle='white'; ctx.font='bold 11px Arial'; ctx.fillText('SIAL',162,72);
 ctx.strokeStyle='#ff2d00'; ctx.lineWidth=5;
 ctx.beginPath(); ctx.ellipse(180,152,32,8,0,0,Math.PI*2); ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.2;
 for(let i=0;i<6;i++){ctx.beginPath(); ctx.moveTo(155+i*10,155); ctx.lineTo(158+i*9,178); ctx.stroke();}
 let ang=+document.getElementById('angulo').value;
 ctx.strokeStyle='yellow'; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(180,390); ctx.lineTo(180,160); ctx.stroke(); ctx.setLineDash([]);
 ctx.fillStyle='yellow'; ctx.font='bold 13px Arial'; ctx.fillText('ÁNGULO '+ang+'°', 125, 210);
 ctx.fillStyle='#ff6b00';
 ctx.beginPath(); ctx.ellipse(45,480,95,55,0,Math.PI,Math.PI*2); ctx.fill();
 ctx.beginPath(); ctx.ellipse(315,480,95,55,0,Math.PI,Math.PI*2); ctx.fill();
 ctx.fillStyle='#0a1628'; ctx.font='bold 11px Arial'; ctx.fillText('TÚ', 32, 465); ctx.fillText('TÚ', 302, 465);
 if(balon.visible){
   let x=balon.x, y=balon.y, r=38*balon.escala;
   ctx.fillStyle='#f2c094';
   ctx.beginPath(); ctx.arc(x-28, y+22, 16, 0, Math.PI*2); ctx.fill();
   ctx.beginPath(); ctx.arc(x+28, y+22, 16, 0, Math.PI*2); ctx.fill();
   ctx.fillStyle='#ff7a00'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
   ctx.strokeStyle='#111'; ctx.lineWidth=2.5; ctx.stroke();
   ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
   ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x,y,r*0.6,0.4,2.2); ctx.stroke();
 }
 if(vuelo){
   ctx.fillStyle='rgba(255,255,255,.85)';
   vuelo.forEach(p=>{ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();});
 }
}
function actualizar(){
 document.getElementById('enc').innerText=enc;
 document.getElementById('tir').innerText=tir;
 document.getElementById('por').innerText= tir? Math.round(enc/tir*100)+'%' : '0%';
}
document.getElementById('angulo').oninput=e=>{document.getElementById('angTxt').innerText=e.target.value+'°'; dibujar();};
document.getElementById('fuerza').oninput=e=>{document.getElementById('fueTxt').innerText=e.target.value+'%';};
function tirar(){
 if(anim) return;
 let ang=+document.getElementById('angulo').value;
 let fue=+document.getElementById('fuerza').value;
 tir++;
 document.getElementById('msg').innerText='¡El balón va volando... 🏀';
 document.getElementById('detalle').innerText=`Desde tus hombros • Ángulo ${ang}° • Fuerza ${fue}%`;
 let t=0; vuelo=[];
 let x0=180, y0=390, x1=180, y1=152;
 let encesta = (ang>=48 && ang<=62 && fue>=62 && fue<=82);
 if(!encesta){ x1 = 180 + (Math.random()<0.5?-1:1)*(35+Math.random()*35); y1 = 145 + Math.random()*25; }
 anim=setInterval(()=>{
  t+=0.045;
  if(t>=1){ clearInterval(anim); anim=null;
   if(encesta){ enc++; document.getElementById('msg').innerText='¡ENCAANASTASTE! 🎉 ¡DESDE TUS HOMBROS!'; document.getElementById('detalle').innerText=`¡Perfecto! Ángulo ${ang}° • Fuerza ${fue}% • ¡Aplausos!`; }
   else { document.getElementById('msg').innerText='Falló... ¡Ajusta ángulo o fuerza! 😅'; document.getElementById('detalle').innerText=`Te pasaste o te faltó. Prueba 52° y 72%`; }
   actualizar();
   setTimeout(()=>{ balon={x:180,y:390,escala:1,visible:true}; vuelo=null; dibujar(); },1100);
   return;
  }
  let x = x0 + (x1-x0)*t;
  let y = y0 + (y1-y0)*t - Math.sin(t*Math.PI)*110;
  let escala = 1 - t*0.65;
  balon={x, y, escala, visible:true};
  if(vuelo.length<25) vuelo.push({x,y});
  dibujar();
 },30);
}
function reiniciar(){enc=0;tir=0;actualizar();document.getElementById('msg').innerText='Marcador en cero. ¡Tú tienes el balón!';}
dibujar(); actualizar();
</script>
</body>
</html>
